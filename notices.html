<!doctype html>
<html lang="bn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Notices | Society of Twelve</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <style>
    .notice { background: #fff; border: 1px solid #e5e7eb; border-radius: 14px; padding: 20px; margin-bottom: 16px; }
    .notice .ref { color: #64748b; font-size: 13px; }
    .notice .meeting { background: #f5f7fa; border-radius: 10px; padding: 10px 14px; margin-top: 10px; font-size: 14px; }
    .running-tag { background: #111827; color: #fff; font-size: 12px; border-radius: 999px; padding: 2px 10px; margin-left: 8px; }
  </style>
</head>
<body>
<header>
  <div class="brand"><div class="logo">SOT</div><div><h1>Notices</h1><p>Society of Twelve</p></div></div>
  <nav><a href="index.html">← Home</a></nav>
</header>
<main>
  <section>
    <h2>Published notices</h2>
    <div id="list"><p>Loading…</p></div>
  </section>
</main>
<footer><strong>Society of Twelve</strong><div>© <span id="year"></span> Society of Twelve — All Rights Reserved.</div></footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
  document.getElementById("year").textContent = new Date().getFullYear();
  const { createClient } = window.supabase;
  const client = createClient(window.SOT_CONFIG.SUPABASE_URL, window.SOT_CONFIG.SUPABASE_ANON_KEY);
  const list = document.getElementById("list");

  (async () => {
    // RLS only returns published, non-archived notices to the public
    const { data, error } = await client
      .from("notices")
      .select("ref_no, title, body, notice_type, meeting_date, meeting_time, meeting_venue, running, published_at")
      .order("published_at", { ascending: false });
    if (error) {
      console.error(error);
      list.innerHTML = `<p>${error.message || "Could not load notices."}</p>`;
      return;
    }
    if (!data.length) { list.innerHTML = `<p>No notices published yet.</p>`; return; }
    list.innerHTML = data.map(n => `
      <article class="notice">
        <div class="ref">${n.ref_no} · ${n.published_at ? new Date(n.published_at).toLocaleDateString() : ""}</div>
        <h3>${n.title}${n.running ? `<span class="running-tag">Running</span>` : ""}</h3>
        <p>${n.body}</p>
        ${n.notice_type === "meeting" ? `<div class="meeting">📅 ${n.meeting_date || ""} · 🕐 ${n.meeting_time || ""} · 📍 ${n.meeting_venue || ""}</div>` : ""}
      </article>`).join("");
  })();
</script>
</body>
</html>
