<!DOCTYPE html>
<html lang="bn">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Members | Society of Twelve</title>

  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, sans-serif; background: #f5f7fa; color: #17202a; }
    header { background: #fff; border-bottom: 1px solid #e5e7eb; padding: 18px 5%; display: flex; align-items: center; justify-content: space-between; }
    .brand { display: flex; align-items: center; gap: 12px; }
    .logo { width: 45px; height: 45px; border-radius: 10px; background: #111827; color: #fff; display: grid; place-items: center; font-weight: bold; }
    main { padding: 35px 5%; max-width: 900px; margin: auto; }
    .panel { background: #fff; border: 1px solid #e5e7eb; border-radius: 16px; padding: 25px; margin-bottom: 25px; }
    label { display: block; margin: 12px 0 6px; font-weight: 600; }
    input, select, textarea { width: 100%; padding: 12px; border: 1px solid #d1d5db; border-radius: 10px; font-size: 15px; font-family: inherit; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 18px; }
    .private { border-left: 3px solid #dc2626; padding-left: 12px; margin-top: 18px; }
    .private small { color: #dc2626; }
    fieldset { border: 1px solid #e5e7eb; border-radius: 10px; margin: 18px 0 0; padding: 6px 16px 16px; }
    legend { font-weight: 700; padding: 0 6px; }
    button { margin-top: 18px; padding: 12px 18px; border: 0; border-radius: 10px; background: #111827; color: #fff; font-size: 15px; cursor: pointer; }
    button.secondary { background: #e5e7eb; color: #111827; }
    button:disabled { opacity: .6; }
    #message { margin-top: 12px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 10px; border-bottom: 1px solid #eef1f4; }
    tr[data-id] { cursor: pointer; }
    tr[data-id]:hover { background: #f9fafb; }
    a.back { color: #64748b; text-decoration: none; }
  </style>
</head>

<body>

<header>
  <div class="brand">
    <div class="logo">SOT</div>
    <div><strong>Society of Twelve</strong> — Members</div>
  </div>
  <a class="back" href="dashboard.html">&larr; Dashboard</a>
</header>

<main>

  <div class="panel">
    <h2 id="formTitle">Register a member</h2>
    <form id="memberForm">
      <input id="id" type="hidden">

      <div class="grid">
        <div>
          <label for="name">Full name *</label>
          <input id="name" type="text" required>
        </div>
        <div>
          <label for="father_name">Father's name</label>
          <input id="father_name" type="text">
        </div>
        <div>
          <label for="house_name">House name</label>
          <input id="house_name" type="text">
        </div>
        <div>
          <label for="village">Village</label>
          <input id="village" type="text">
        </div>
        <div>
          <label for="mobile">Mobile *</label>
          <input id="mobile" type="text" required>
        </div>
        <div>
          <label for="whatsapp">WhatsApp</label>
          <input id="whatsapp" type="text">
        </div>
        <div>
          <label for="email">Email (optional)</label>
          <input id="email" type="email">
        </div>
        <div>
          <label for="dob">Date of birth</label>
          <input id="dob" type="date">
        </div>
        <div>
          <label for="blood_group">Blood group</label>
          <select id="blood_group">
            <option value="">— select —</option>
            <option>A+</option><option>A-</option>
            <option>B+</option><option>B-</option>
            <option>AB+</option><option>AB-</option>
            <option>O+</option><option>O-</option>
          </select>
        </div>
        <div>
          <label for="profession">Profession</label>
          <input id="profession" type="text">
        </div>
        <div>
          <label for="fee_category">Fee category</label>
          <select id="fee_category"><option value="">— select —</option></select>
        </div>
        <div>
          <label for="monthly_fee">Custom fee (BDT, overrides category)</label>
          <input id="monthly_fee" type="number" step="0.01" min="0" placeholder="leave empty to use category fee">
        </div>
        <div>
          <label for="join_date">Join date</label>
          <input id="join_date" type="date">
        </div>
        <div>
          <label for="active">Status</label>
          <select id="active">
            <option value="true">Active</option>
            <option value="false">Inactive</option>
          </select>
        </div>
        <div>
          <label for="photo_url">Profile photo URL</label>
          <input id="photo_url" type="url" placeholder="https://...">
        </div>
      </div>

      <label for="education">Education (optional)</label>
      <input id="education" type="text">

      <label for="skills">Skills (comma-separated)</label>
      <input id="skills" type="text" placeholder="teaching, design">

      <label for="interests">Interests (comma-separated)</label>
      <input id="interests" type="text" placeholder="reading, football">

      <label for="short_bio">Short bio (optional)</label>
      <textarea id="short_bio" rows="3"></textarea>

      <fieldset class="private">
        <legend>Private identity — organization only</legend>
        <small>Never shown on public pages or to the member.</small>
        <div class="grid">
          <div>
            <label for="nid_number">NID number</label>
            <input id="nid_number" type="text">
          </div>
          <div>
            <label for="birth_registration_id">Birth registration ID</label>
            <input id="birth_registration_id" type="text">
          </div>
          <div>
            <label for="passport_number">Passport number</label>
            <input id="passport_number" type="text">
          </div>
        </div>
      </fieldset>

      <button id="saveButton" type="submit">Save member</button>
      <button id="cancelButton" type="button" class="secondary" style="display:none">Cancel edit</button>
    </form>
    <div id="message"></div>
  </div>

  <div class="panel">
    <h2>Members</h2>
    <div class="grid" style="grid-template-columns: 2fr 1fr 1fr;">
      <div>
        <label for="search">Search (name / ID / mobile)</label>
        <input id="search" type="search" placeholder="type to filter…">
      </div>
      <div>
        <label for="statusFilter">Status</label>
        <select id="statusFilter">
          <option value="">All</option>
          <option value="active">Active</option>
          <option value="inactive">Inactive</option>
        </select>
      </div>
      <div>
        <label for="professionFilter">Profession</label>
        <select id="professionFilter"><option value="">All</option></select>
      </div>
    </div>
    <table>
      <thead><tr><th>Member ID</th><th>Name</th><th>Mobile</th><th>Profession</th><th>Blood group</th><th>Status</th></tr></thead>
      <tbody id="memberRows"><tr><td colspan="6">Loading...</td></tr></tbody>
    </table>
    <p style="color:#64748b;font-size:14px">Click a row to edit that member.</p>
  </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../config.js"></script>
<script src="admin.js"></script>

<script>
(async () => {
  const result = await checkAdminAccess();
  if (!result) return;

  const rows = document.getElementById("memberRows");
  const message = document.getElementById("message");
  const button = document.getElementById("saveButton");
  const cancelButton = document.getElementById("cancelButton");
  const formTitle = document.getElementById("formTitle");
  const form = document.getElementById("memberForm");

  // admin edits every field, including the private identity fields
  const csv = (v) => v.split(",").map(s => s.trim()).filter(Boolean);
  const fromCsv = (a) => Array.isArray(a) ? a.join(", ") : "";

  // fee categories from settings (profession-fee): drives the member's default monthly due
  async function loadFeeCategories() {
    const { data, error } = await supabaseClient
      .from("fee_categories").select("name, monthly_fee").order("name");
    if (error) { console.error(error); return; }
    document.getElementById("fee_category").innerHTML =
      `<option value="">— select —</option>` +
      data.map(c => `<option value="${c.name}">${c.name} (${c.monthly_fee})</option>`).join("");
  }

  // ponytail: the Society of Twelve is a small roster — load all members once and
  // filter/search in the browser. Move to server-side filters if it ever outgrows a page.
  let allMembers = [];
  const search = document.getElementById("search");
  const statusFilter = document.getElementById("statusFilter");
  const professionFilter = document.getElementById("professionFilter");

  function renderRows() {
    const q = search.value.trim().toLowerCase();
    const status = statusFilter.value;
    const profession = professionFilter.value;
    const shown = allMembers.filter(m => {
      if (status === "active" && !m.active) return false;
      if (status === "inactive" && m.active) return false;
      if (profession && (m.profession || "") !== profession) return false;
      if (q && ![m.name, m.member_id, m.mobile].some(f => (f || "").toLowerCase().includes(q))) return false;
      return true;
    });
    rows.innerHTML = shown.length
      ? shown.map(m =>
          `<tr data-id="${m.member_id}"><td>${m.member_id}</td><td>${m.name}</td><td>${m.mobile || "—"}</td><td>${m.profession || "—"}</td><td>${m.blood_group || "—"}</td><td>${m.active ? "Active" : "Inactive"}</td></tr>`
        ).join("")
      : `<tr><td colspan="6">${allMembers.length ? "No members match." : "No members yet."}</td></tr>`;
  }

  async function loadMembers() {
    const { data, error } = await supabaseClient
      .from("members")
      .select("member_id, name, mobile, profession, blood_group, active")
      .order("created_at", { ascending: false });
    if (error) {
      console.error(error);
      rows.innerHTML = `<tr><td colspan="6">${error.message || "Could not load members."}</td></tr>`;
      return;
    }
    allMembers = data;
    // rebuild the profession filter from the data present
    const professions = [...new Set(data.map(m => m.profession).filter(Boolean))].sort();
    professionFilter.innerHTML = `<option value="">All</option>` +
      professions.map(p => `<option>${p}</option>`).join("");
    renderRows();
  }

  [search, statusFilter, professionFilter].forEach(el =>
    el.addEventListener("input", renderRows));

  function resetForm() {
    form.reset();
    document.getElementById("id").value = "";
    formTitle.textContent = "Register a member";
    button.textContent = "Save member";
    cancelButton.style.display = "none";
  }

  async function editMember(memberId) {
    const { data, error } = await supabaseClient
      .from("members").select("*").eq("member_id", memberId).single();
    if (error || !data) { console.error(error); return; }
    document.getElementById("id").value = data.id;
    for (const key of ["name","father_name","house_name","village","mobile","whatsapp",
      "email","dob","blood_group","profession","fee_category","monthly_fee","join_date","photo_url",
      "short_bio","nid_number","birth_registration_id","passport_number"]) {
      document.getElementById(key).value = data[key] ?? "";
    }
    document.getElementById("active").value = String(data.active);
    document.getElementById("education").value = data.education ?? "";
    document.getElementById("skills").value = fromCsv(data.skills);
    document.getElementById("interests").value = fromCsv(data.interests);
    formTitle.textContent = "Edit " + data.member_id;
    button.textContent = "Update member";
    cancelButton.style.display = "inline-block";
    window.scrollTo(0, 0);
  }

  rows.addEventListener("click", (e) => {
    const tr = e.target.closest("tr[data-id]");
    if (tr) editMember(tr.dataset.id);
  });
  cancelButton.addEventListener("click", resetForm);

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    button.disabled = true;
    message.style.color = "#dc2626";
    message.textContent = "";

    const val = (id) => document.getElementById(id).value.trim();
    const record = {
      name: val("name"),
      father_name: val("father_name") || null,
      house_name: val("house_name") || null,
      village: val("village") || null,
      mobile: val("mobile"),
      whatsapp: val("whatsapp") || null,
      email: val("email") || null,
      dob: val("dob") || null,
      blood_group: val("blood_group") || null,
      profession: val("profession") || null,
      fee_category: val("fee_category") || null,
      monthly_fee: val("monthly_fee") || null,       // custom override; string → Postgres numeric(12,2); never a JS float
      join_date: val("join_date") || null,
      active: document.getElementById("active").value === "true",
      photo_url: val("photo_url") || null,
      education: val("education") || null,
      skills: csv(val("skills")),
      interests: csv(val("interests")),
      short_bio: val("short_bio") || null,
      nid_number: val("nid_number") || null,
      birth_registration_id: val("birth_registration_id") || null,
      passport_number: val("passport_number") || null,
    };

    const editingId = document.getElementById("id").value;
    // member_id is assigned server-side by the sequence default — never sent from the client
    const { error } = editingId
      ? await supabaseClient.from("members").update(record).eq("id", editingId)
      : await supabaseClient.from("members").insert(record);

    if (error) {
      console.error(error);
      message.textContent = error.message || "Could not save member.";
    } else {
      message.style.color = "#16a34a";
      message.textContent = editingId ? "Member updated." : "Member saved.";
      resetForm();
      await loadMembers();
    }
    button.disabled = false;
  });

  await Promise.all([loadMembers(), loadFeeCategories()]);
})();
</script>

</body>
</html>
