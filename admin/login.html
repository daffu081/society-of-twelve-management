<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | Society of Twelve</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
    }

    .login-box {
      width: min(420px, 92%);
      background: white;
      padding: 35px;
      border-radius: 18px;
      box-shadow: 0 10px 35px rgba(0,0,0,.08);
    }

    .logo {
      width: 70px;
      height: 70px;
      margin: 0 auto 15px;
      border-radius: 16px;
      background: #111827;
      color: white;
      display: grid;
      place-items: center;
      font-weight: bold;
      font-size: 20px;
    }

    h1 {
      text-align: center;
      margin: 0;
    }

    .subtitle {
      text-align: center;
      color: #64748b;
      margin-bottom: 28px;
    }

    label {
      display: block;
      margin: 14px 0 6px;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 15px;
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 14px;
      border: 0;
      border-radius: 10px;
      background: #111827;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
    }

    #message {
      margin-top: 15px;
      text-align: center;
      color: #dc2626;
    }
  </style>
</head>

<body>

  <div class="login-box">

    <div class="logo">SOT</div>

    <h1>Society of Twelve</h1>
    <div class="subtitle">Admin Login</div>

    <form id="loginForm">

      <label for="email">Email</label>
      <input
        id="email"
        type="email"
        placeholder="Admin email"
        required
      >

      <label for="password">Password</label>
      <input
        id="password"
        type="password"
        placeholder="Password"
        required
      >

      <button id="loginButton" type="submit">
        Login
      </button>

    </form>

    <div id="message"></div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="../config.js"></script>
  <script src="admin.js"></script>

</body>
</html>
