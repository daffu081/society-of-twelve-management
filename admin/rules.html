<!DOCTYPE html>
<html lang="bn">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rules | Society of Twelve</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, sans-serif; background: #f5f7fa; color: #17202a; }
    header { background: #fff; border-bottom: 1px solid #e5e7eb; padding: 18px 5%; display: flex; align-items: center; justify-content: space-between; }
    .brand { display: flex; align-items: center; gap: 12px; }
    .logo { width: 45px; height: 45px; border-radius: 10px; background: #111827; color: #fff; display: grid; place-items: center; font-weight: bold; }
    main { padding: 35px 5%; max-width: 900px; margin: auto; }
    .panel { background: #fff; border: 1px solid #e5e7eb; border-radius: 16px; padding: 25px; margin-bottom: 25px; }
    label { display: block; margin: 12px 0 6px; font-weight: 600; }
    input, textarea { width: 100%; padding: 12px; border: 1px solid #d1d5db; border-radius: 10px; font-size: 15px; font-family: inherit; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 18px; }
    button { margin-top: 18px; padding: 12px 18px; border: 0; border-radius: 10px; background: #111827; color: #fff; font-size: 15px; cursor: pointer; }
    button.secondary { background: #e5e7eb; color: #111827; }
    button.small { margin: 0; padding: 8px 12px; font-size: 13px; }
    button:disabled { opacity: .6; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 10px; border-bottom: 1px solid #eef1f4; }
    #message { margin-top: 12px; }
    a.back { color: #64748b; text-decoration: none; }
    .history { font-size: 14px; color: #64748b; margin-top: 8px; }
  </style>
</head>

<body>

<header>
  <div class="brand">
    <div class="logo">SOT</div>
    <div><strong>Society of Twelve</strong> — Rules &amp; Regulations</div>
  </div>
  <a class="back" href="dashboard.html">&larr; Dashboard</a>
</header>

<main>

  <div class="panel">
    <h2 id="formTitle">Add a rule</h2>
    <form id="ruleForm">
      <input id="id" type="hidden">
      <div class="grid">
        <div>
          <label for="title">Title *</label>
          <input id="title" type="text" required>
        </div>
        <div>
          <label for="display_order">Display order</label>
          <input id="display_order" type="number" value="0">
        </div>
      </div>
      <label for="body">Rule text *</label>
      <textarea id="body" rows="5" required></textarea>
      <button type="submit">Save rule</button>
      <button id="cancelButton" type="button" class="secondary" style="display:none">Cancel edit</button>
    </form>
    <div id="message"></div>
  </div>

  <div class="panel">
    <h2>Rules</h2>
    <table>
      <thead><tr><th>Order</th><th>Title</th><th>Status</th><th>Version</th><th></th></tr></thead>
      <tbody id="ruleRows"><tr><td colspan="5">Loading...</td></tr></tbody>
    </table>
  </div>

  <div class="panel" id="historyPanel" hidden>
    <h3>Version history — <span id="historyTitle"></span></h3>
    <div id="historyList"></div>
    <button id="closeHistory" type="button" class="secondary">Close</button>
  </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../config.js"></script>
<script src="admin.js"></script>

<script>
(async () => {
  const result = await checkAdminAccess();
  if (!result) return;
  const { admin } = result;

  // Super Admin only (BR2). RLS enforces the same server-side.
  if (admin.role !== "super_admin") {
    document.querySelector("main").innerHTML =
      `<div class="panel">Only a Super Admin can manage rules &amp; regulations.</div>`;
    return;
  }

  const rows = document.getElementById("ruleRows");
  const message = document.getElementById("message");
  const form = document.getElementById("ruleForm");
  const cancelButton = document.getElementById("cancelButton");
  let rules = [];

  function say(ok, text) {
    message.style.color = ok ? "#16a34a" : "#dc2626";
    message.textContent = text;
  }

  function resetForm() {
    form.reset();
    document.getElementById("id").value = "";
    document.getElementById("display_order").value = "0";
    document.getElementById("formTitle").textContent = "Add a rule";
    cancelButton.style.display = "none";
  }
  cancelButton.addEventListener("click", resetForm);

  async function loadRules() {
    const { data, error } = await supabaseClient
      .from("rules").select("*").order("display_order").order("created_at");
    if (error) {
      console.error(error);
      rows.innerHTML = `<tr><td colspan="5">${error.message || "Could not load rules."}</td></tr>`;
      return;
    }
    rules = data;
    rows.innerHTML = data.length
      ? data.map(r => `<tr data-id="${r.id}">
          <td>${r.display_order}</td><td>${r.title}</td><td>${r.status}</td><td>v${r.version}</td>
          <td style="white-space:nowrap">
            <button type="button" class="small" data-act="edit">Edit</button>
            ${r.status === "published"
              ? `<button type="button" class="small" data-act="unpublish">Unpublish</button>`
              : `<button type="button" class="small" data-act="publish">Publish</button>`}
            ${r.status === "archived" ? "" : `<button type="button" class="small secondary" data-act="archive">Archive</button>`}
            <button type="button" class="small secondary" data-act="history">History</button>
          </td></tr>`).join("")
      : `<tr><td colspan="5">No rules yet.</td></tr>`;
  }

  rows.addEventListener("click", async (e) => {
    const btn = e.target.closest("button[data-act]");
    if (!btn) return;
    const r = rules.find(x => x.id === btn.closest("tr").dataset.id);
    if (!r) return;

    if (btn.dataset.act === "edit") {
      document.getElementById("id").value = r.id;
      document.getElementById("formTitle").textContent = `Edit "${r.title}" (v${r.version})`;
      document.getElementById("title").value = r.title;
      document.getElementById("body").value = r.body;
      document.getElementById("display_order").value = r.display_order;
      cancelButton.style.display = "inline-block";
      window.scrollTo(0, 0);
      return;
    }

    if (btn.dataset.act === "history") {
      const { data, error } = await supabaseClient
        .from("rule_versions").select("*").eq("rule_id", r.id)
        .order("version", { ascending: false });
      if (error) { console.error(error); return; }
      document.getElementById("historyTitle").textContent = r.title;
      document.getElementById("historyList").innerHTML = data.length
        ? data.map(v => `<div class="history"><strong>v${v.version}</strong> (${new Date(v.archived_at).toLocaleString()}) — ${v.title}<br>${v.body}</div>`).join("<hr>")
        : `<p class="history">No previous versions.</p>`;
      document.getElementById("historyPanel").hidden = false;
      return;
    }

    btn.disabled = true;
    const status = btn.dataset.act === "publish" ? "published"
      : btn.dataset.act === "unpublish" ? "draft" : "archived";
    const { error } = await supabaseClient.from("rules").update({ status }).eq("id", r.id);
    if (error) { console.error(error); say(false, error.message || "Update failed."); }
    else { say(true, `"${r.title}" is now ${status}.`); await loadRules(); }
    btn.disabled = false;
  });

  document.getElementById("closeHistory").addEventListener("click", () => {
    document.getElementById("historyPanel").hidden = true;
  });

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const record = {
      title: document.getElementById("title").value.trim(),
      body: document.getElementById("body").value.trim(),
      display_order: parseInt(document.getElementById("display_order").value || "0", 10),
    };
    const editingId = document.getElementById("id").value;
    // edits bump version via the rules_keep_history trigger (previous version snapshotted)
    const { error } = editingId
      ? await supabaseClient.from("rules").update(record).eq("id", editingId)
      : await supabaseClient.from("rules").insert(record);
    if (error) { console.error(error); say(false, error.message || "Could not save."); }
    else { say(true, editingId ? "Rule updated — previous version kept in history." : "Rule saved as draft."); resetForm(); await loadRules(); }
  });

  await loadRules();
})();
</script>

</body>
</html>
