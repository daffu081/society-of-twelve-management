<!DOCTYPE html>
<html lang="bn">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Awards | Society of Twelve</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, sans-serif; background: #f5f7fa; color: #17202a; }
    header { background: #fff; border-bottom: 1px solid #e5e7eb; padding: 18px 5%; display: flex; align-items: center; justify-content: space-between; }
    .brand { display: flex; align-items: center; gap: 12px; }
    .logo { width: 45px; height: 45px; border-radius: 10px; background: #111827; color: #fff; display: grid; place-items: center; font-weight: bold; }
    main { padding: 35px 5%; max-width: 900px; margin: auto; }
    .panel { background: #fff; border: 1px solid #e5e7eb; border-radius: 16px; padding: 25px; margin-bottom: 25px; }
    label { display: block; margin: 12px 0 6px; font-weight: 600; }
    input, select, textarea { width: 100%; padding: 12px; border: 1px solid #d1d5db; border-radius: 10px; font-size: 15px; font-family: inherit; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 18px; }
    button { margin-top: 18px; padding: 12px 18px; border: 0; border-radius: 10px; background: #111827; color: #fff; font-size: 15px; cursor: pointer; }
    button.secondary { background: #e5e7eb; color: #111827; }
    button.small { margin: 0; padding: 8px 12px; font-size: 13px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 10px; border-bottom: 1px solid #eef1f4; }
    #message { margin-top: 12px; }
    a.back { color: #64748b; text-decoration: none; }
  </style>
</head>

<body>

<header>
  <div class="brand">
    <div class="logo">SOT</div>
    <div><strong>Society of Twelve</strong> — Awards &amp; Achievements</div>
  </div>
  <a class="back" href="dashboard.html">&larr; Dashboard</a>
</header>

<main>

  <div class="panel">
    <h2 id="formTitle">Record an award</h2>
    <form id="awardForm">
      <input id="id" type="hidden">
      <div class="grid">
        <div>
          <label for="title">Title *</label>
          <input id="title" type="text" required>
        </div>
        <div>
          <label for="member">Member (optional)</label>
          <select id="member"><option value="">— none —</option></select>
        </div>
        <div>
          <label for="recipient_name">Recipient name (if not a member)</label>
          <input id="recipient_name" type="text">
        </div>
        <div>
          <label for="award_date">Date</label>
          <input id="award_date" type="date">
        </div>
        <div>
          <label for="image_url">Image / document URL</label>
          <input id="image_url" type="url" placeholder="https://…">
        </div>
        <div>
          <label for="visible">Public visibility</label>
          <select id="visible">
            <option value="false">Hidden</option>
            <option value="true">Public</option>
          </select>
        </div>
      </div>
      <label for="description">Description</label>
      <textarea id="description" rows="3"></textarea>
      <button type="submit">Save award</button>
      <button id="cancelButton" type="button" class="secondary" style="display:none">Cancel edit</button>
    </form>
    <div id="message"></div>
  </div>

  <div class="panel">
    <h2>Awards</h2>
    <table>
      <thead><tr><th>Title</th><th>Recipient</th><th>Date</th><th>Visibility</th><th></th></tr></thead>
      <tbody id="awardRows"><tr><td colspan="5">Loading...</td></tr></tbody>
    </table>
  </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../config.js"></script>
<script src="admin.js"></script>

<script>
(async () => {
  const result = await checkAdminAccess();
  if (!result) return;

  const rows = document.getElementById("awardRows");
  const message = document.getElementById("message");
  const form = document.getElementById("awardForm");
  const cancelButton = document.getElementById("cancelButton");
  const memberSelect = document.getElementById("member");
  let awards = [];

  function say(ok, text) {
    message.style.color = ok ? "#16a34a" : "#dc2626";
    message.textContent = text;
  }

  async function loadMembers() {
    const { data, error } = await supabaseClient
      .from("members").select("id, member_id, name").order("name");
    if (error) { console.error(error); return; }
    memberSelect.innerHTML = `<option value="">— none —</option>` +
      data.map(m => `<option value="${m.id}">${m.member_id} — ${m.name}</option>`).join("");
  }

  function resetForm() {
    form.reset();
    document.getElementById("id").value = "";
    document.getElementById("formTitle").textContent = "Record an award";
    cancelButton.style.display = "none";
  }
  cancelButton.addEventListener("click", resetForm);

  async function loadAwards() {
    const { data, error } = await supabaseClient
      .from("awards").select("*, members(member_id, name)")
      .order("award_date", { ascending: false, nullsFirst: false });
    if (error) {
      console.error(error);
      rows.innerHTML = `<tr><td colspan="5">${error.message || "Could not load awards."}</td></tr>`;
      return;
    }
    awards = data;
    rows.innerHTML = data.length
      ? data.map(a => `<tr data-id="${a.id}">
          <td>${a.title}</td>
          <td>${a.members ? a.members.name : (a.recipient_name || "—")}</td>
          <td>${a.award_date || "—"}</td>
          <td>${a.visible ? "Public" : "Hidden"}</td>
          <td><button type="button" class="small" data-act="edit">Edit</button></td>
        </tr>`).join("")
      : `<tr><td colspan="5">No awards yet.</td></tr>`;
  }

  rows.addEventListener("click", (e) => {
    const btn = e.target.closest("button[data-act='edit']");
    if (!btn) return;
    const a = awards.find(x => x.id === btn.closest("tr").dataset.id);
    if (!a) return;
    document.getElementById("id").value = a.id;
    document.getElementById("formTitle").textContent = "Edit award";
    for (const k of ["title", "recipient_name", "award_date", "image_url", "description"]) {
      document.getElementById(k).value = a[k] ?? "";
    }
    memberSelect.value = a.member_id ?? "";
    document.getElementById("visible").value = String(a.visible);
    cancelButton.style.display = "inline-block";
    window.scrollTo(0, 0);
  });

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const val = (id) => document.getElementById(id).value.trim();
    // snapshot the member's name for public display — anon can't join members (RLS)
    const memberName = memberSelect.value
      ? memberSelect.options[memberSelect.selectedIndex].text.split("— ").pop()
      : null;
    const record = {
      title: val("title"),
      member_id: memberSelect.value || null,
      recipient_name: val("recipient_name") || memberName || null,
      award_date: val("award_date") || null,
      image_url: val("image_url") || null,
      description: val("description") || null,
      visible: document.getElementById("visible").value === "true",
      updated_at: new Date().toISOString(),
    };
    const editingId = document.getElementById("id").value;
    const { error } = editingId
      ? await supabaseClient.from("awards").update(record).eq("id", editingId)
      : await supabaseClient.from("awards").insert(record);
    if (error) { console.error(error); say(false, error.message || "Could not save."); }
    else { say(true, editingId ? "Award updated." : "Award saved."); resetForm(); await loadAwards(); }
  });

  await Promise.all([loadAwards(), loadMembers()]);
})();
</script>

</body>
</html>
