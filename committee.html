<!doctype html>
<html lang="bn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Executive Committee | Society of Twelve</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <style>
    .com-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 18px; }
    .com-card { background: #fff; border: 1px solid #e5e7eb; border-radius: 14px; padding: 18px; text-align: center; }
    .com-card img { width: 88px; height: 88px; border-radius: 50%; object-fit: cover; background: #eef1f4; }
    .com-card .avatar { width: 88px; height: 88px; border-radius: 50%; margin: 0 auto; background: #111827; color: #fff; display: grid; place-items: center; font-size: 28px; font-weight: bold; }
    .com-card h3 { margin: 12px 0 2px; }
    .com-card .position { color: #111827; font-weight: 600; margin: 0; }
    .com-card .year { color: #64748b; font-size: 13px; }
    .com-card .bio { font-size: 14px; margin-top: 8px; }
  </style>
</head>
<body>
<header>
  <div class="brand"><div class="logo">SOT</div><div><h1>Executive Committee</h1><p>Society of Twelve</p></div></div>
  <nav><a href="index.html">← Home</a></nav>
</header>
<main>
  <section>
    <h2>Committee</h2>
    <div id="grid" class="com-grid"><p>Loading…</p></div>
  </section>
</main>
<footer><strong>Society of Twelve</strong><div>© <span id="year"></span> Society of Twelve — All Rights Reserved.</div></footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
  document.getElementById("year").textContent = new Date().getFullYear();
  const { createClient } = window.supabase;
  const client = createClient(window.SOT_CONFIG.SUPABASE_URL, window.SOT_CONFIG.SUPABASE_ANON_KEY);
  const grid = document.getElementById("grid");

  (async () => {
    // RLS returns only visible entries to the public; ordered by display_order (AC2)
    const { data, error } = await client
      .from("committee_members")
      .select("name, position, year, short_bio, photo_url, display_order")
      .order("display_order").order("name");
    if (error) {
      console.error(error);
      grid.innerHTML = `<p>${error.message || "Could not load the committee."}</p>`;
      return;
    }
    if (!data.length) { grid.innerHTML = `<p>No committee members listed yet.</p>`; return; }
    grid.innerHTML = data.map(c => {
      const avatar = c.photo_url
        ? `<img src="${c.photo_url}" alt="${c.name}">`
        : `<div class="avatar">${(c.name || "?").trim().charAt(0).toUpperCase()}</div>`;
      return `<article class="com-card">
        ${avatar}
        <h3>${c.name}</h3>
        <p class="position">${c.position}</p>
        ${c.year ? `<div class="year">${c.year}</div>` : ""}
        ${c.short_bio ? `<p class="bio">${c.short_bio}</p>` : ""}
      </article>`;
    }).join("");
  })();
</script>
</body>
</html>
