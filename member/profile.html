<!DOCTYPE html>
<html lang="bn">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My profile | Society of Twelve</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, sans-serif; background: #f5f7fa; color: #17202a; }
    header { background: #fff; border-bottom: 1px solid #e5e7eb; padding: 18px 5%; display: flex; align-items: center; justify-content: space-between; }
    .brand { display: flex; align-items: center; gap: 12px; }
    .logo { width: 45px; height: 45px; border-radius: 10px; background: #111827; color: #fff; display: grid; place-items: center; font-weight: bold; }
    main { padding: 35px 5%; max-width: 720px; margin: auto; }
    .panel { background: #fff; border: 1px solid #e5e7eb; border-radius: 16px; padding: 25px; margin-bottom: 25px; }
    label { display: block; margin: 12px 0 6px; font-weight: 600; }
    input, textarea { width: 100%; padding: 12px; border: 1px solid #d1d5db; border-radius: 10px; font-size: 15px; font-family: inherit; }
    .readonly dt { font-weight: 600; color: #64748b; margin-top: 12px; }
    .readonly dd { margin: 2px 0 0; }
    button { margin-top: 18px; padding: 12px 18px; border: 0; border-radius: 10px; background: #111827; color: #fff; font-size: 15px; cursor: pointer; }
    button.link { background: none; color: #64748b; padding: 0; }
    button:disabled { opacity: .6; }
    #message { margin-top: 12px; }
  </style>
</head>

<body>

<header>
  <div class="brand">
    <div class="logo">SOT</div>
    <div><strong>Society of Twelve</strong> — My profile</div>
  </div>
  <button class="link" onclick="logoutMember()">Log out</button>
</header>

<main id="content"><div class="panel">Loading...</div></main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../config.js"></script>
<script src="member.js"></script>
<script>
(async () => {
  const content = document.getElementById("content");
  const result = await loadMemberSelf();
  if (!result) return;
  const { member } = result;
  if (!member) {
    content.innerHTML = `<div class="panel">No member record is linked to your email. Please contact an admin.</div>`;
    return;
  }

  const fromCsv = (a) => Array.isArray(a) ? a.join(", ") : "";
  const csv = (v) => v.split(",").map(s => s.trim()).filter(Boolean);
  const esc = (v) => (v ?? "—");

  // Read-only fields are admin-managed; the member edits only the four permitted ones.
  content.innerHTML = `
    <div class="panel readonly">
      <h2>${esc(member.name)} <small style="color:#64748b">${esc(member.member_id)}</small></h2>
      <dl>
        <dt>Mobile</dt><dd>${esc(member.mobile)}</dd>
        <dt>Email</dt><dd>${esc(member.email)}</dd>
        <dt>Blood group</dt><dd>${esc(member.blood_group)}</dd>
        <dt>Profession</dt><dd>${esc(member.profession)}</dd>
        <dt>Monthly fee</dt><dd>${esc(member.monthly_fee)}</dd>
        <dt>Status</dt><dd>${member.active ? "Active" : "Inactive"}</dd>
      </dl>
      <p style="color:#64748b;font-size:13px">Identity, fee, member ID and status are managed by admins.</p>
    </div>
    <div class="panel">
      <h3>Edit my details</h3>
      <form id="selfForm">
        <label for="education">Education</label>
        <input id="education" type="text" value="${esc(member.education) === "—" ? "" : member.education}">
        <label for="skills">Skills (comma-separated)</label>
        <input id="skills" type="text" value="${fromCsv(member.skills)}">
        <label for="interests">Interests (comma-separated)</label>
        <input id="interests" type="text" value="${fromCsv(member.interests)}">
        <label for="short_bio">Short bio</label>
        <textarea id="short_bio" rows="3">${member.short_bio ?? ""}</textarea>
        <button id="saveButton" type="submit">Save my details</button>
      </form>
      <div id="message"></div>
    </div>`;

  document.getElementById("selfForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const button = document.getElementById("saveButton");
    const message = document.getElementById("message");
    button.disabled = true;
    message.textContent = "";
    const val = (id) => document.getElementById(id).value.trim();
    // Only permitted fields are sent; the DB trigger blocks anything else anyway.
    const { error } = await memberClient.from("members").update({
      education: val("education") || null,
      skills: csv(val("skills")),
      interests: csv(val("interests")),
      short_bio: val("short_bio") || null,
    }).eq("id", member.id);
    if (error) {
      console.error(error);
      message.style.color = "#dc2626";
      message.textContent = error.message || "Could not save.";
    } else {
      message.style.color = "#16a34a";
      message.textContent = "Saved.";
    }
    button.disabled = false;
  });
})();
</script>

</body>
</html>
